<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="t d"><title id="t">AI Assistant Evaluation Pipeline architecture</title><desc id="d">Conceptual workflow: Labelled scenarios to Evaluation runner to Scoring and gates to Release report. Detailed deployment choices are covered in the walkthrough.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#55dfb2"/></marker></defs><rect width="1600" height="440" fill="#081929"/><g font-family="Arial,sans-serif" font-weight="700"><text x="70" y="65" font-size="23" fill="#55dfb2">VERIQTA WORLD · CONCEPTUAL SYSTEM WORKFLOW</text><rect x="70" y="155" width="310" height="145" rx="18" fill="#143148" stroke="#3b6078"/><text x="95" y="215" font-size="23" fill="#edf6ff">Labelled scenarios</text><path d="M385 230H433" stroke="#55dfb2" stroke-width="4" marker-end="url(#arrow)"/><rect x="450" y="155" width="310" height="145" rx="18" fill="#143148" stroke="#3b6078"/><text x="475" y="215" font-size="23" fill="#edf6ff">Evaluation runner</text><path d="M765 230H813" stroke="#55dfb2" stroke-width="4" marker-end="url(#arrow)"/><rect x="830" y="155" width="310" height="145" rx="18" fill="#143148" stroke="#3b6078"/><text x="855" y="215" font-size="23" fill="#edf6ff">Scoring and gates</text><path d="M1145 230H1193" stroke="#55dfb2" stroke-width="4" marker-end="url(#arrow)"/><rect x="1210" y="155" width="310" height="145" rx="18" fill="#143148" stroke="#3b6078"/><text x="1235" y="215" font-size="23" fill="#edf6ff">Release report</text><text x="70" y="385" font-size="19" fill="#adc6d9">Validate outputs. Restrict access. Observe failures. Verify outcomes.</text></g></svg>